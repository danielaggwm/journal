<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4eefe" id="theme-color-meta">
    <title>Journal Demo</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="icon" type="image/svg" href="icon.svg">
    <script>
          document.addEventListener('DOMContentLoaded', () => {
                const menuButton = document.getElementById('menu-toggle');
                const menuWrapper = document.querySelector('.menu-wrapper');
                menuButton.addEventListener('click', () => {
                menuButton.classList.toggle('open');
                menuWrapper.classList.toggle('open');
                });
            });
    </script>


</head>
<body>
    <div class="header-container">
        <div class="menu-wrapper">
          <button id="menu-toggle" class="menu-button" aria-label="Toggle menu">
            <span class="menu-line line1"></span>
            <span class="menu-line line2"></span>
          </button>
          <nav class="menu-items">
            <a href="#">ABOUT</a>
            <a href="#">TRENDS</a>
            <a href="#">CUSTOMIZE</a>
            <a href="#">LOGOUT</a>
          </nav>
        </div>
      
        <div class="filter-wrap">
          <select id="view-mode-selector">
            <option value="image">Image</option>
            <option value="mood">Mood</option>
            <option value="workout">Worked out</option>
            <option value="read">Read a book</option>
            <option value="called">Called parents</option>
          </select>
        </div>
    </div>
</body>
</html>
