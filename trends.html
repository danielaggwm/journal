    <script type="module">
        let selectedHabitId = "habit1"; 

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
          getAuth,
          onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import {
          getFirestore,
          collection,
          getDocs,
          doc,
          getDoc,
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
      
        const firebaseConfig = {
          apiKey: "AIzaSyBMOeKuVRPshQvryw8wux5Q9xDuUZ9Nlms",
          authDomain: "journal-danielaggwm.firebaseapp.com",
          projectId: "journal-danielaggwm",
          storageBucket: "journal-danielaggwm",
          messagingSenderId: "711305745141",
          appId: "1:711305745141:web:cfd67957ec5c920035ebbc",
          measurementId: "G-Q5SQGEPBF2"
        };
      
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
      
        const moodColors = {
          good: "#4caf50",
          sad: "#2196f3",
          angry: "#f44336",
          excited: "#ff9800"
        };
      
        let currentView = "weekly";
        let currentStartDate = getStartOfWeek(new Date());
        let allEntries = [];
      
        onAuthStateChanged(auth, async user => {
          if (!user) return;
      
          const entriesRef = collection(db, "journalEntries");
          const snap = await getDocs(entriesRef);
      
          allEntries = [];
      
          snap.forEach(doc => {
            const [entryUid] = doc.id.split("_");
            if (entryUid !== user.uid) return;
      
            const data = doc.data();
            const dateStr = doc.id.split("_")[1];
            const [year, month, day] = dateStr.split("-").map(Number);
            const date = new Date(year, month - 1, day);
            date.setHours(0, 0, 0, 0);

      
            allEntries.push({ date, mood: data.mood, habits: data.habits });
          });
      
          await drawStreakCounter(); // ✅ draw UI before trying to update values
          await renderForCurrentView();
        });
      
        // ✅ Updated to make weeks start on Monday
        function getStartOfWeek(date) {
          const d = new Date(date);
          const day = d.getDay(); // 0 (Sun) to 6 (Sat)
          const diff = (day + 6) % 7; // Shift so Monday is 0
          d.setDate(d.getDate() - diff);
          d.setHours(0, 0, 0, 0);
          return d;
        }
      
        function getStartOfMonth(date) {
          const d = new Date(date);
          d.setDate(1);
          d.setHours(0, 0, 0, 0);
          return d;
        }
      
        function updateRangeLabel(start, end) {
          const format = d => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
          document.getElementById('current-range').textContent = `${format(start)} – ${format(end)}`;
        }
      
        function filterEntriesByView(entries, view, refDate) {
          let start = new Date(refDate);
          let end = new Date(refDate);
      
          if (view === 'weekly') {
            start = getStartOfWeek(refDate);
            end = new Date(start);
            end.setDate(start.getDate() + 6);
          } else if (view === 'monthly') {
            start = getStartOfMonth(refDate);
            end = new Date(start);
            end.setMonth(start.getMonth() + 1);
            end.setDate(0);
          } else {
            document.getElementById('current-range').textContent = "All Time";
            return entries;
          }
      
          updateRangeLabel(start, end);
      
          return entries.filter(e => {
            const day = new Date(e.date);
            day.setHours(0, 0, 0, 0);
            return day >= start && day <= end;
          });
        }
      
        function drawMoodBarChart(data) {
            const container = document.getElementById('mood-bar-chart');
            const wrapper = document.getElementById('chart-wrapper');
            container.innerHTML = "";

            const margin = { top: 40, right: 25, bottom: 60, left: 25 };
            const baseWidth = window.innerWidth < 410 ? 350 : 400;
            const width = baseWidth - margin.left - margin.right;
            const height = 300 - margin.top - margin.bottom;

            const svg = d3.select(container)
                .append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .style("font-family", "'Poppins', sans-serif")
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            const moods = Object.keys(data);
            const counts = Object.values(data);

            const x = d3.scaleBand()
                .domain(moods)
                .range([0, width])
                .padding(0.4);

            const y = d3.scaleLinear()
                .domain([0, d3.max(counts) || 1]) 
                .nice()
                .range([height, 0]);

            svg.selectAll("rect")
                .data(moods)
                .enter()
                .append("rect")
                .attr("x", d => x(d))
                .attr("y", d => y(data[d]))
                .attr("width", x.bandwidth())
                .attr("height", d => height - y(data[d]))
                .attr("fill", d => moodColors[d])
                .attr("rx", 6)
                .attr("ry", 6);

            svg.selectAll("text.label")
                .data(moods)
                .enter()
                .append("text")
                .filter(d => data[d] > 0)
                .attr("class", "label")
                .attr("x", d => x(d) + x.bandwidth() / 2)
                .attr("y", d => y(data[d]) - 6)
                .attr("text-anchor", "middle")
                .attr("fill", "#3d1b53")
                .attr("font-size", "14px")
                .text(d => data[d]);

            const iconPaths = {
                good: "/journal/icons/good.svg",
                sad: "/journal/icons/sad.svg",
                angry: "/journal/icons/angry.svg",
                excited: "/journal/icons/excited.svg"
            };

            moods.forEach(mood => {
                const xCenter = x(mood) + x.bandwidth() / 2;

                svg.append("image")
                    .attr("href", iconPaths[mood])
                    .attr("x", xCenter - 12)
                    .attr("y", height + 4)
                    .attr("width", 24)
                    .attr("height", 24);

                svg.append("text")
                    .attr("x", xCenter)
                    .attr("y", height + 40)
                    .attr("text-anchor", "middle")
                    .attr("font-size", "12px")
                    .attr("fill", "#3d1b53")
                    .text(mood.toUpperCase());
            });

            //  Now that everything is ready, reveal the container + add the class that adds styles
            wrapper.classList.add("chart-visible");
            wrapper.style.display = "block";
            container.style.display = "block";
        }

      
        function renderForCurrentView() {
            const filtered = filterEntriesByView(allEntries, currentView, currentStartDate);

            const moodCounts = {
                good: 0,
                sad: 0,
                angry: 0,
                excited: 0
            };

            filtered.forEach(entry => {
                if (entry.mood && moodCounts.hasOwnProperty(entry.mood)) {
                moodCounts[entry.mood]++;
                }
            });

            drawMoodBarChart(moodCounts);

            // ✅ Add this line to refresh the streak section
            const user = auth.currentUser;
            if (!user) return;

            getDoc(doc(db, "habitLabels", user.uid)).then(docSnap => {
                const habitLabels = docSnap.exists()
                ? docSnap.data()
                : {
                    habit1: "Worked out?",
                    habit2: "Read a book?",
                    habit3: "Called your parents?"
                    };

                updateStreakData(habitLabels);
            });
        }

      
        document.getElementById('weekly').addEventListener('click', () => {
          currentView = 'weekly';
          currentStartDate = getStartOfWeek(new Date());
          renderForCurrentView();
        });
      
        document.getElementById('monthly').addEventListener('click', () => {
          currentView = 'monthly';
          currentStartDate = getStartOfMonth(new Date());
          renderForCurrentView();
        });
      
        document.getElementById('all').addEventListener('click', () => {
          currentView = 'all';
          document.getElementById('current-range').textContent = "All Time";
          renderForCurrentView();
        });
      
        document.getElementById('prev-date').addEventListener('click', () => {
          if (currentView === 'weekly') {
            currentStartDate.setDate(currentStartDate.getDate() - 7);
          } else if (currentView === 'monthly') {
            currentStartDate.setMonth(currentStartDate.getMonth() - 1);
          }
          renderForCurrentView();
        });
      
        document.getElementById('next-date').addEventListener('click', () => {
          if (currentView === 'weekly') {
            currentStartDate.setDate(currentStartDate.getDate() + 7);
          } else if (currentView === 'monthly') {
            currentStartDate.setMonth(currentStartDate.getMonth() + 1);
          }
          renderForCurrentView();
        });

        const toggleButtons = document.querySelectorAll('.toggle-buttons button');

        toggleButtons.forEach(button => {
        button.addEventListener('click', () => {
            toggleButtons.forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
        });
        });

        // —————— Elements ——————
        const menuButton = document.getElementById('menu-toggle');
        const menuWrapper = document.querySelector('.menu-wrapper');
        const menuLinks = document.querySelectorAll('.menu-items a');
    
        // —————— MENU: open/close toggle ——————
        menuButton.addEventListener('click', () => {
        menuButton.classList.toggle('open');
        menuWrapper.classList.toggle('open');
        });
    
        // —————— MENU: collapse on any link click ——————
        menuLinks.forEach(link => {
        link.addEventListener('click', () => {
            menuButton.classList.remove('open');
            menuWrapper.classList.remove('open');
        });
        });
    
        // —————— LOGOUT: Handle logout ——————
        document.getElementById('logout').addEventListener('click', async (e) => {
        e.preventDefault();
        await auth.signOut();
        window.location.href = 'index.html';
        });

        async function drawStreakCounter() {
            const container = document.getElementById("streak-count");

            const wrapper = document.createElement("div");
            wrapper.style.display = "flex";
            wrapper.style.flexDirection = "column";
            wrapper.style.alignItems = "center";
            wrapper.style.marginTop = "2rem";
            wrapper.style.fontFamily = "'Poppins', sans-serif";
            wrapper.style.color =  "#3d1b53";

            const selector = document.createElement("select");
            selector.style.padding = "8px";
            selector.style.marginBottom = "1rem";

            const user = auth.currentUser;
            if (!user) return;

            const habitDocRef = doc(db, "habitLabels", user.uid);
            const docSnap = await getDoc(habitDocRef);
            const habitLabels = docSnap.exists()
                ? docSnap.data()
                : {
                    habit1: "Worked out?",
                    habit2: "Read a book?",
                    habit3: "Called your parents?"
                };

            const habitList = [
                { id: "habit1", label: habitLabels.habit1 },
                { id: "habit2", label: habitLabels.habit2 },
                { id: "habit3", label: habitLabels.habit3 },
                { id: "ALL", label: "All Habits" }
            ];

            habitList.forEach(opt => {
                const option = document.createElement("option");
                option.value = opt.id;
                option.textContent = opt.label;
                selector.appendChild(option);
            });

            selector.value = selectedHabitId;

            selector.addEventListener("change", () => {
                selectedHabitId = selector.value;
                updateStreakData(habitLabels);
            });

            wrapper.appendChild(selector);

            const grid = document.createElement("div");
            grid.id = "streak-grid"; 
            grid.style.display = "grid";
            grid.style.gridTemplateColumns = "repeat(3, 1fr)";
            grid.style.gap = "2rem";
            wrapper.appendChild(grid);

            container.innerHTML = "";
            container.appendChild(wrapper);

            updateStreakData(habitLabels);
        }

        function updateStreakData(habitLabels) {
            const selectedHabits =
                selectedHabitId === "ALL"
                ? ["habit1", "habit2", "habit3"]
                : [selectedHabitId];

            const streakData = computeHabitStreaks(allEntries, selectedHabits, habitLabels);
            const totalEntries = filterEntriesByView(allEntries, currentView, currentStartDate).length;

            const grid = document.getElementById("streak-grid");
            grid.innerHTML = "";

            const createMetric = (label, value) => {
                const box = document.createElement("div");
                box.style.textAlign = "center";
                const val = document.createElement("div");
                val.textContent = value;
                val.style.fontSize = "2rem";
                val.style.fontWeight = "600";
                const lbl = document.createElement("div");
                lbl.innerHTML = label.replace(" ", "<br>");
                lbl.style.fontSize = "0.9rem";
                lbl.style.color = "#3d1b53";
                box.appendChild(val);
                box.appendChild(lbl);
                return box;
            };

            grid.appendChild(createMetric("CURRENT STREAK", streakData.current));
            grid.appendChild(createMetric("LONGEST STREAK", streakData.longest));
            grid.appendChild(createMetric("TOTAL ENTRIES", totalEntries));
        }


        function computeHabitStreaks(entries, selectedHabits, currentLabels = {}) {
            const entriesByDate = new Map();
            entries.forEach(e => {
                const d = new Date(e.date);
                d.setHours(0, 0, 0, 0);
                entriesByDate.set(d.getTime(), e);
            });

            const formatDate = d => d.toISOString().split("T")[0];

            const validDateSet = new Set();

            for (const [ts, entry] of entriesByDate.entries()) {
                const hasAllHabits = selectedHabits.every(habitId => {
                const habitEntry = entry.habits?.[habitId];
                if (!habitEntry) return false;

                const currentLabel = currentLabels[habitId];
                const entryLabel = habitEntry.label || habitId;

                if (currentLabel && entryLabel !== currentLabel) return false;

                return habitEntry.value === "yes";
                });

                if (hasAllHabits) {
                validDateSet.add(formatDate(new Date(ts)));
                }
            }

            // ——— CURRENT STREAK ———
            let current = 0;
            let cursor = new Date();
            cursor.setHours(0, 0, 0, 0);

            const todayTs = cursor.getTime();
            const entryToday = entriesByDate.get(todayTs);

            // If there's no valid entry today, move the cursor to yesterday
            const isValidToday = (() => {
            if (!entryToday) return false;
            return selectedHabits.every(habitId => {
                const habitEntry = entryToday.habits?.[habitId];
                if (!habitEntry) return false;

                const currentLabel = currentLabels[habitId];
                const entryLabel = habitEntry.label || habitId;
                if (currentLabel && entryLabel !== currentLabel) return false;

                return habitEntry.value === "yes";
            });
            })();

            if (!isValidToday) {
            cursor.setDate(cursor.getDate() - 1);
            }

            while (true) {
                const ts = cursor.getTime();
                const entry = entriesByDate.get(ts);

                if (!entry) break;

                const isValid = selectedHabits.every(habitId => {
                const habitEntry = entry.habits?.[habitId];
                if (!habitEntry) return false;

                const currentLabel = currentLabels[habitId];
                const entryLabel = habitEntry.label || habitId;

                if (currentLabel && entryLabel !== currentLabel) return false;

                return habitEntry.value === "yes";
                });

                if (!isValid) break;

                current++;
                cursor.setDate(cursor.getDate() - 1);
            }

            // ——— LONGEST STREAK ———
            const validDates = [...validDateSet].map(d => new Date(d)).sort((a, b) => a - b);
            let longest = 0;
            let streak = 0;
            let prev = null;

            for (const date of validDates) {
                if (!prev) {
                streak = 1;
                } else {
                const diff = (date - prev) / (1000 * 60 * 60 * 24);
                streak = diff === 1 ? streak + 1 : 1;
                }
                longest = Math.max(longest, streak);
                prev = date;
            }

            return {
                current,
                longest,
                total: validDateSet.size
            };
        }


      // ===== AI SEARCH ===== //
      document.getElementById('search-btn').addEventListener('click', async () => {
        const query = document.getElementById('search-input').value;
        if (!query) return;
        
        const results = await searchEntries(query);
        displaySearchResults(results, query);
      });

      function formatDateForSearchResults(dateStr) {
        try {
          // If date is in YYYY-MM-DD format (from Python)
          if (typeof dateStr === 'string' && dateStr.match(/^\d{4}-\d{2}-\d{2}$/)) {
            const [year, month, day] = dateStr.split('-').map(Number);
            // Create date in local timezone (avoids UTC conversion)
            const date = new Date(year, month - 1, day);
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return date.toLocaleDateString('en-US', options);
          }
          
          // Fallback to original formatDate for other formats
          return formatDate(dateStr);
        } catch (e) {
          console.error('Search date formatting error:', e);
          return dateStr; // Return raw string if parsing fails
        }
      }

      async function searchEntries(query) {
        try {
          const user = auth.currentUser;
          if (!user) {
            console.log("User not logged in");
            return [];
          }

          const token = await user.getIdToken();
          const response = await fetch(
            `https://journal-search-711305745141.us-central1.run.app/search?q=${encodeURIComponent(query)}`,
            {
              headers: {
                'Authorization': token,
                'Content-Type': 'application/json'
              },
              mode: 'cors', // Explicitly enable CORS
              credentials: 'include' // Required if using cookies/sessions (unlikely in your case)
            }
          );

          //before - worked perfectly locally
          // const response = await fetch(`http://localhost:8080/search?q=${encodeURIComponent(query)}`, {
          //   headers: {
          //     'Authorization': token,
          //     'Content-Type': 'application/json'
          //   }
          // });

          // RENDER OPTION
          // const baseUrl = window.location.hostname === 'localhost'
          //   ? 'http://localhost:8080'
          //   : 'https://backend-journal.onrender.com';

          //   const response = await fetch(`${baseUrl}/search?q=${encodeURIComponent(query)}`, {
          //   headers: {
          //     'Authorization': token,
          //     'Content-Type': 'application/json'
          //   }
          // });

          if (!response.ok) {
            throw new Error(await response.text());
          }

          const data = await response.json();
          console.log("Search results:", data);
          
          if (data.results && data.results.length > 0) {
            return { 
              results: data.results, 
              query: data.query,
              stats: data.stats 
            };
          } else {
            return { results: [], query };
          }
        } catch (error) {
          console.error("Search failed:", error);
          return { results: [], query };
        }
      }

      function displaySearchResults(resultObj, searchQuery) {
        const container = document.getElementById('search-results');
        container.innerHTML = '';
        
        const { results, query, stats } = resultObj;
        const effectiveQuery = query || searchQuery;

        if (!results || results.length === 0) {
          container.innerHTML = `
            <div class="no-results">
              <p>No entries found for "${effectiveQuery}"</p>
              ${stats ? `<small>Scanned ${stats.total_entries} entries</small>` : ''}
            </div>
          `;
          return;
        }

        // Add stats summary boxes
        container.innerHTML += `
          <div class="search-stats">
            <div class="stat-box">
              <div class="stat-value">${stats.exact_matches}</div>
              <div class="stat-label">Exact Matches</div>
            </div>
            <div class="stat-box">
              <div class="stat-value">${stats.semantic_matches}</div>
              <div class="stat-label">Semantic Matches</div>
            </div>
            <div class="stat-box">
              <div class="stat-value">${stats.total_entries}</div>
              <div class="stat-label">Total Entries</div>
            </div>
          </div>
        `;

        // Add the search results
        results.forEach(entry => {
          const entryEl = document.createElement('div');
          entryEl.className = `search-result ${entry.match_type}`;
          
          let highlightedText = highlightMatches(
            entry.description, 
            effectiveQuery, 
            entry.matching_words || []
          );
          
          entryEl.innerHTML = `
          <div class="entry-header">
            <h3>${formatDateForSearchResults(entry.date)}</h3>
            <button class="expand-toggle" aria-label="Expand entry">
              <img src="icons/top-arrow.svg" class="top-arrow" alt="Collapse">
              <img src="icons/bottom-arrow.svg" class="bottom-arrow" alt="Expand">
            </button>
          </div>
          <div class="entry-content">
            <div class="text-content">
              ${highlightedText.replace(/\n/g, '<br>')}
            </div>
            <div class="fade-out"></div>
            ${entry.imageUrl ? `<img src="${entry.imageUrl}" class="preview-image">` : ''}
          </div>
          <div class="match-details">
            ${entry.matching_words?.length ? `
              <div class="matched-words">
                Related words: ${entry.matching_words.map(w => `<span>${w}</span>`).join(', ')}
              </div>
            ` : ''}
            <span class="match-type ${entry.match_type}">${entry.match_type}</span>
            <span class="score">${entry.score.toFixed(2)}</span>
            <span class="details">${entry.match_details}</span>
          </div>
        `;

          // Add expand/collapse functionality
          const contentDiv = entryEl.querySelector('.entry-content');
          const toggleBtn = entryEl.querySelector('.expand-toggle');
          
          toggleBtn.addEventListener('click', () => {
            contentDiv.classList.toggle('expanded');
            toggleBtn.classList.toggle('expanded');
            
            // Update aria-label for accessibility
            const isExpanded = contentDiv.classList.contains('expanded');
            toggleBtn.setAttribute('aria-label', isExpanded ? 'Collapse entry' : 'Expand entry');
          });

          container.appendChild(entryEl);
        });
      }

      function highlightMatches(text, query, matchingWords) {
        let result = text;
        
        // First find all exact matches to protect them
        const exactMatches = [];
        const cleanQuery = query.replace(/[^\w\s]/g, '');
        
        if (cleanQuery) {
          const regex = new RegExp(`(${escapeRegExp(cleanQuery)})`, 'gi');
          result = result.replace(regex, (match) => {
            exactMatches.push(match.toLowerCase());
            return `<mark class="exact-match">${match}</mark>`;
          });
        }

        // Then highlight semantic matches, skipping exact matches
        matchingWords.forEach(word => {
          const cleanWord = word.replace(/[^\w]/g, '');
          if (cleanWord.length > 2 && !exactMatches.includes(cleanWord.toLowerCase())) {
            const regex = new RegExp(`(\\b${escapeRegExp(cleanWord)}\\b)(?!</mark>)`, 'gi');
            result = result.replace(regex, '<mark class="semantic-match">$1</mark>');
          }
        });

        return result;
      }

      function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }

      function formatDate(dateStr) {
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        return new Date(dateStr).toLocaleDateString('en-US', options);
      }

      // clear functionality
      const clearButton = document.getElementById('clear-search');
      const searchInput = document.getElementById('search-input');

      // Show/hide clear button based on input
      searchInput.addEventListener('input', () => {
        clearButton.style.display = searchInput.value ? 'block' : 'none';
      });

      // Clear the input when clicked
      clearButton.addEventListener('click', () => {
        searchInput.value = '';
        searchInput.focus();
        clearButton.style.display = 'none';
        document.getElementById('search-results').innerHTML = '';
      });

      // Hide clear button initially
      clearButton.style.display = 'none';
    </script>

    <div class="controls-container">
        <div class="toggle-buttons">
          <button id="weekly" class="active">WEEKLY</button>
          <button id="monthly">MONTHLY</button>
          <button id="all">ALL</button>
        </div>
      
        <div class="nav-arrow">
          <button id="prev-date">
            <img src="icons/left-arrow.svg" alt="Previous Day" />
          </button>
          <span id="current-range">THIS WEEK</span>
          <button id="next-date">
            <img src="icons/right-arrow.svg" alt="Next Day" />
          </button>
        </div>
    </div>
      
    <!-- Plots -->
    <div id="chart-wrapper" style="display: none;">
        <div id="mood-bar-chart"></div>
    </div>

    <div id="streak-count"></div>

    <!-- AI Search -->
    <div class="search-section">
      <div class="search-container">
        <div class="search-bar">
          <input type="text" id="search-input" placeholder="Search your journal...">
          <button id="clear-search" class="clear-button">
            <img src="icons/close4.svg" alt="Clear search">
          </button>
        </div>
        <button id="search-btn">
          <img src="icons/search.svg" alt="Search" />
        </button>
      </div>

      <div id="search-results" class="search-results-container"></div>
    </div>
</body>
</html>
