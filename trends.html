        // ✅ Updated to make weeks start on Monday
        function getStartOfWeek(date) {
          const d = new Date(date);
          const day = d.getDay(); // 0 (Sun) to 6 (Sat)
          const diff = (day + 6) % 7; // Shift so Monday is 0
          d.setDate(d.getDate() - diff);
          d.setHours(0, 0, 0, 0);
          return d;
        }
      
        function getStartOfMonth(date) {
          const d = new Date(date);
          d.setDate(1);
          d.setHours(0, 0, 0, 0);
          return d;
        }
      
        function updateRangeLabel(start, end) {
          const format = d => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
          document.getElementById('current-range').textContent = `${format(start)} – ${format(end)}`;
        }
      
        function filterEntriesByView(entries, view, refDate) {
          let start = new Date(refDate);
          let end = new Date(refDate);
      
          if (view === 'weekly') {
            start = getStartOfWeek(refDate);
            end = new Date(start);
            end.setDate(start.getDate() + 6);
          } else if (view === 'monthly') {
            start = getStartOfMonth(refDate);
            end = new Date(start);
            end.setMonth(start.getMonth() + 1);
            end.setDate(0);
          } else {
            document.getElementById('current-range').textContent = "All Time";
            return entries;
          }
      
          updateRangeLabel(start, end);
      
          return entries.filter(e => {
            const day = new Date(e.date);
            day.setHours(0, 0, 0, 0);
            return day >= start && day <= end;
          });
        }
      
        function drawMoodBarChart(data) {
            const container = document.getElementById('mood-bar-chart');
            const wrapper = document.getElementById('chart-wrapper');
            container.innerHTML = "";

            const margin = { top: 40, right: 25, bottom: 60, left: 25 };
            const baseWidth = window.innerWidth < 410 ? 350 : 400;
            const width = baseWidth - margin.left - margin.right;
            const height = 300 - margin.top - margin.bottom;

            const svg = d3.select(container)
                .append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .style("font-family", "'Poppins', sans-serif")
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            const moods = Object.keys(data);
            const counts = Object.values(data);

            const x = d3.scaleBand()
                .domain(moods)
                .range([0, width])
                .padding(0.4);

            const y = d3.scaleLinear()
                .domain([0, d3.max(counts) || 1]) 
                .nice()
                .range([height, 0]);

            svg.selectAll("rect")
                .data(moods)
                .enter()
                .append("rect")
                .attr("x", d => x(d))
                .attr("y", d => y(data[d]))
                .attr("width", x.bandwidth())
                .attr("height", d => height - y(data[d]))
                .attr("fill", d => moodColors[d])
                .attr("rx", 6)
                .attr("ry", 6);

            svg.selectAll("text.label")
                .data(moods)
                .enter()
                .append("text")
                .filter(d => data[d] > 0)
                .attr("class", "label")
                .attr("x", d => x(d) + x.bandwidth() / 2)
                .attr("y", d => y(data[d]) - 6)
                .attr("text-anchor", "middle")
                .attr("fill", "#3d1b53")
                .attr("font-size", "14px")
                .text(d => data[d]);

            const iconPaths = {
                good: "/journal/icons/good.svg",
                sad: "/journal/icons/sad.svg",
                angry: "/journal/icons/angry.svg",
                excited: "/journal/icons/excited.svg"
            };

            moods.forEach(mood => {
                const xCenter = x(mood) + x.bandwidth() / 2;

                svg.append("image")
                    .attr("href", iconPaths[mood])
                    .attr("x", xCenter - 12)
                    .attr("y", height + 4)
                    .attr("width", 24)
                    .attr("height", 24);

                svg.append("text")
                    .attr("x", xCenter)
                    .attr("y", height + 40)
                    .attr("text-anchor", "middle")
                    .attr("font-size", "12px")
                    .attr("fill", "#3d1b53")
                    .text(mood.toUpperCase());
            });

            //  Now that everything is ready, reveal the container + add the class that adds styles
            wrapper.classList.add("chart-visible");
            wrapper.style.display = "block";
            container.style.display = "block";
        }

        function computeHabitStreaks(entries, selectedHabits, currentLabels = {}) {
            const entriesByDate = new Map();
            entries.forEach(e => {
                const d = new Date(e.date);
                d.setHours(0, 0, 0, 0);
                entriesByDate.set(d.getTime(), e);
            });

            const formatDate = d => d.toISOString().split("T")[0];

            const validDateSet = new Set();

            for (const [ts, entry] of entriesByDate.entries()) {
                const hasAllHabits = selectedHabits.every(habitId => {
                const habitEntry = entry.habits?.[habitId];
                if (!habitEntry) return false;

                const currentLabel = currentLabels[habitId];
                const entryLabel = habitEntry.label || habitId;

                if (currentLabel && entryLabel !== currentLabel) return false;

                return habitEntry.value === "yes";
                });

                if (hasAllHabits) {
                validDateSet.add(formatDate(new Date(ts)));
                }
            }

            // ——— CURRENT STREAK ———
            let current = 0;
            let cursor = new Date();
            cursor.setHours(0, 0, 0, 0);

            const todayTs = cursor.getTime();
            const entryToday = entriesByDate.get(todayTs);

            // If there's no valid entry today, move the cursor to yesterday
            const isValidToday = (() => {
            if (!entryToday) return false;
            return selectedHabits.every(habitId => {
                const habitEntry = entryToday.habits?.[habitId];
                if (!habitEntry) return false;

                const currentLabel = currentLabels[habitId];
                const entryLabel = habitEntry.label || habitId;
                if (currentLabel && entryLabel !== currentLabel) return false;

                return habitEntry.value === "yes";
            });
            })();

            if (!isValidToday) {
            cursor.setDate(cursor.getDate() - 1);
            }

            while (true) {
                const ts = cursor.getTime();
                const entry = entriesByDate.get(ts);

                if (!entry) break;

                const isValid = selectedHabits.every(habitId => {
                const habitEntry = entry.habits?.[habitId];
                if (!habitEntry) return false;

                const currentLabel = currentLabels[habitId];
                const entryLabel = habitEntry.label || habitId;

                if (currentLabel && entryLabel !== currentLabel) return false;

                return habitEntry.value === "yes";
                });

                if (!isValid) break;

                current++;
                cursor.setDate(cursor.getDate() - 1);
            }

            // ——— LONGEST STREAK ———
            const validDates = [...validDateSet].map(d => new Date(d)).sort((a, b) => a - b);
            let longest = 0;
            let streak = 0;
            let prev = null;

            for (const date of validDates) {
                if (!prev) {
                streak = 1;
                } else {
                const diff = (date - prev) / (1000 * 60 * 60 * 24);
                streak = diff === 1 ? streak + 1 : 1;
                }
                longest = Math.max(longest, streak);
                prev = date;
            }

            return {
                current,
                longest,
                total: validDateSet.size
            };
        }

      function formatDateForSearchResults(dateStr) {
        try {
          // If date is in YYYY-MM-DD format (from Python)
          if (typeof dateStr === 'string' && dateStr.match(/^\d{4}-\d{2}-\d{2}$/)) {
            const [year, month, day] = dateStr.split('-').map(Number);
            // Create date in local timezone (avoids UTC conversion)
            const date = new Date(year, month - 1, day);
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return date.toLocaleDateString('en-US', options);
          }
          
          // Fallback to original formatDate for other formats
          return formatDate(dateStr);
        } catch (e) {
          console.error('Search date formatting error:', e);
          return dateStr; // Return raw string if parsing fails
        }
      }

      // SIMPLER LOCAL SEARCH FUNCTION
      async function searchEntries(query) {
        const lowerQuery = query.trim().toLowerCase();
        if (!lowerQuery) return { results: [], query, stats: { total_entries: allEntries.length, exact_matches: 0, semantic_matches: 0 } };

        let exactMatchesCount = 0;

        // Filter entries by description only
        const results = allEntries
          .filter(entry => entry.description && entry.description.toLowerCase().includes(lowerQuery))
          .map(entry => {
            exactMatchesCount++;
            // Find all words in description matching the query (for highlighting)
            const matchingWords = [query];
            return {
              date: entry.date,
              description: entry.description,
              match_type: "exact",
              matching_words: matchingWords,
              score: 1, // you can later implement smarter scoring if needed
              match_details: "Local search"
            };
          });

        return {
          results,
          query,
          stats: {
            total_entries: allEntries.length,
            exact_matches: exactMatchesCount,
            semantic_matches: 0 // not doing ML now, so semantic = 0
          }
        };
      }

            // Update aria-label for accessibility
            const isExpanded = contentDiv.classList.contains('expanded');
            toggleBtn.setAttribute('aria-label', isExpanded ? 'Collapse entry' : 'Expand entry');
          });

          container.appendChild(entryEl);
        });
      }

      

      function highlightMatches(text, query, matchingWords) {
        let result = text;
        
        // First find all exact matches to protect them
        const exactMatches = [];
        const cleanQuery = query.replace(/[^\w\s]/g, '');
        
        if (cleanQuery) {
          const regex = new RegExp(`(${escapeRegExp(cleanQuery)})`, 'gi');
          result = result.replace(regex, (match) => {
            exactMatches.push(match.toLowerCase());
            return `<mark class="exact-match">${match}</mark>`;
          });
        }

        // Then highlight semantic matches, skipping exact matches
        matchingWords.forEach(word => {
          const cleanWord = word.replace(/[^\w]/g, '');
          if (cleanWord.length > 2 && !exactMatches.includes(cleanWord.toLowerCase())) {
            const regex = new RegExp(`(\\b${escapeRegExp(cleanWord)}\\b)(?!</mark>)`, 'gi');
            result = result.replace(regex, '<mark class="semantic-match">$1</mark>');
          }
        });

        return result;
      }

      function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }

      function formatDate(dateStr) {
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        return new Date(dateStr).toLocaleDateString('en-US', options);
      }

      const clearButton = document.getElementById('clear-search');
      const searchInput = document.getElementById('search-input');

      searchInput.addEventListener('input', () => {

      // ===== JOURNAL WRAPPED =====

      function getHabitCount(entries, habitId) {
        return entries.filter(e => e.habits?.[habitId]?.value === 'yes').length;
      }

      function pctChange(curr, prev) {
        if (prev === 0 && curr === 0) return null;
        if (prev === 0) return 100;
        return Math.round(((curr - prev) / prev) * 100);
      }

      function moodScore(mood) {
        return { excited: 2, good: 1, sad: -1, angry: -2 }[mood] ?? 0;
      }

      const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

      function filterRange(entries, start, end) {
        const s = new Date(start); s.setHours(0,0,0,0);
        const e2 = new Date(end); e2.setHours(23,59,59,999);
        return entries.filter(en => { const d = new Date(en.date); d.setHours(0,0,0,0); return d >= s && d <= e2; });
      }

      function moodCorrelation(entries) {
        const days = Array(7).fill(null).map(() => ({ sum: 0, n: 0 }));
        entries.forEach(e => {
          if (!e.mood) return;
          const idx = new Date(e.date).getDay();
          days[idx].sum += moodScore(e.mood);
          days[idx].n++;
        });
        let bestDay = -1, bestAvg = -Infinity;
        days.forEach((d, i) => {
          if (d.n === 0) return;
          const avg = d.sum / d.n;
          if (avg > bestAvg) { bestAvg = avg; bestDay = i; }
        });
        return bestDay;
      }

      function longestStreakForHabit(entries, habitId) {
        const dates = entries
          .filter(e => e.habits?.[habitId]?.value === 'yes')
          .map(e => { const d = new Date(e.date); d.setHours(0,0,0,0); return d; })
          .sort((a, b) => a - b);
        let best = 0, cur = 0, prev = null, bestStart = null, curStart = null;
        dates.forEach(d => {
          if (!prev || (d - prev) / 86400000 !== 1) { cur = 1; curStart = d; }
          else cur++;
          if (cur > best) { best = cur; bestStart = new Date(curStart); }
          prev = d;
        });
        return { count: best, startDate: bestStart };
      }

      function bestMonthForHabit(entries, habitId) {
        const months = {};
        entries.forEach(e => {
          if (e.habits?.[habitId]?.value !== 'yes') return;
          const d = new Date(e.date);
          const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
          months[k] = (months[k] || 0) + 1;
        });
        let bestK = null, bestN = 0;
        Object.entries(months).forEach(([k, v]) => { if (v > bestN) { bestN = v; bestK = k; } });
        if (!bestK) return { count: 0, label: 'N/A' };
        const [yr, mo] = bestK.split('-').map(Number);
        return { count: bestN, label: new Date(yr, mo-1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }) };
      }

      function getAllTimeRange(entries) {
        if (entries.length === 0) return '';
        const dates = entries.map(e => new Date(e.date)).sort((a,b) => a - b);
        const fmt = d => d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }).toUpperCase();
        const first = dates[0], last = dates[dates.length - 1];
        if (first.getFullYear() === last.getFullYear() && first.getMonth() === last.getMonth()) return fmt(first);
        return `${fmt(first)} - ${fmt(last)}`;
      }

      function pctLabel(pct) {
        if (pct === null) return 'No previous data to compare.';
        if (pct > 0) return `↑ ${pct}% vs last period`;
        if (pct < 0) return `↓ ${Math.abs(pct)}% vs last period`;
        return 'Same as last period';
      }

      function buildWeeklySlides(refStart, entries, hl) {
        const wkStart = getStartOfWeek(refStart);
        const wkEnd = new Date(wkStart); wkEnd.setDate(wkStart.getDate() + 6);
        const pwStart = new Date(wkStart); pwStart.setDate(wkStart.getDate() - 7);
        const pwEnd = new Date(wkStart); pwEnd.setDate(wkStart.getDate() - 1);
        const cur = filterRange(entries, wkStart, wkEnd);
        const prev = filterRange(entries, pwStart, pwEnd);
        const h1c = getHabitCount(cur,'habit1'), h1p = getHabitCount(prev,'habit1');
        const h2c = getHabitCount(cur,'habit2'), h2p = getHabitCount(prev,'habit2');
        const h3c = getHabitCount(cur,'habit3');
        const h1pct = pctChange(h1c, h1p), h2pct = pctChange(h2c, h2p);
        const bestDay = moodCorrelation(cur);
        const enc1 = h1pct === null ? 'No prior data to compare.' : h1pct > 0 ? `↑ ${h1pct}% more than last week — great work! 🎉` : h1pct < 0 ? `↓ ${Math.abs(h1pct)}% less than last week — you've got this! 💪` : 'Same as last week — staying consistent!';
        const enc2 = h2pct === null ? 'No prior data to compare.' : h2pct > 0 ? `↑ ${h2pct}% more than last week — keep it up! 🎉` : h2pct < 0 ? `↓ ${Math.abs(h2pct)}% less than last week — tomorrow is a new day! 💪` : 'Same as last week — nice consistency!';
        const h3msg = h3c >= 6 ? 'Near-perfect week! 🌟' : h3c >= 4 ? 'Solid effort this week!' : h3c >= 2 ? 'Keep building that habit!' : 'Room to grow — you can do it!';
        const dateRange = `${wkStart.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${wkEnd.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`;
        function getHabitDays(habitId) {
          const days = Array(7).fill(false);
          cur.forEach(e => {
            if (e.habits?.[habitId]?.value === 'yes') {
              const dayIdx = (new Date(e.date).getDay() + 6) % 7;
              days[dayIdx] = true;
            }
          });
          return days;
        }
        const slides = [
          { type:'intro', smallHeader:'YOUR WEEK', title:'WEEK IN REVIEW', subtitle:dateRange, entryCount:cur.length, bg:'linear-gradient(135deg,#fa9d93 0%,#ffd3ce 100%)' },
          { type:'weekly-habit', label:hl.habit1, stat:h1c, subtitle:enc1, days:getHabitDays('habit1'), bg:'linear-gradient(135deg,#f4eefe 0%,#e2d8f5 100%)' },
          { type:'weekly-habit', label:hl.habit2, stat:h2c, subtitle:enc2, days:getHabitDays('habit2'), bg:'linear-gradient(135deg,#ffd3ce 0%,#ffe8e5 100%)' },
          { type:'weekly-habit', label:hl.habit3, stat:h3c, subtitle:h3msg, days:getHabitDays('habit3'), bg:'linear-gradient(135deg,#fff8e1 0%,#ffefc9 100%)' },
        ];
        return slides;
      }

      function buildMonthlySlides(refStart, entries, hl) {
        const mStart = getStartOfMonth(refStart);
        const mEnd = new Date(mStart); mEnd.setMonth(mStart.getMonth()+1); mEnd.setDate(0);
        const pmStart = new Date(mStart); pmStart.setMonth(mStart.getMonth()-1);
        const pmEnd = new Date(mStart); pmEnd.setDate(0);
        const cur = filterRange(entries, mStart, mEnd);
        const prev = filterRange(entries, pmStart, pmEnd);
        const totalDays = mEnd.getDate();
        const h1c=getHabitCount(cur,'habit1'), h1p=getHabitCount(prev,'habit1');
        const h2c=getHabitCount(cur,'habit2'), h2p=getHabitCount(prev,'habit2');
        const h3c=getHabitCount(cur,'habit3'), h3p=getHabitCount(prev,'habit3');
        const moodCounts = {excited:0,good:0,sad:0,angry:0};
        cur.forEach(e => { if (e.mood && e.mood in moodCounts) moodCounts[e.mood]++; });
        const totalMoods = Object.values(moodCounts).reduce((a,b)=>a+b,0);
        const positivePct = totalMoods > 0 ? Math.round((moodCounts.good+moodCounts.excited)/totalMoods*100) : 0;
        const bestDay = moodCorrelation(cur);
        const h1s=longestStreakForHabit(cur,'habit1'), h2s=longestStreakForHabit(cur,'habit2'), h3s=longestStreakForHabit(cur,'habit3');
        const topS = [{...h1s,label:hl.habit1},{...h2s,label:hl.habit2},{...h3s,label:hl.habit3}].reduce((b,s)=>s.count>b.count?s:b,{count:0,label:''});
        const monthLabel = mStart.toLocaleDateString('en-US',{month:'long',year:'numeric'});
        const slides = [
          { type:'intro', smallHeader:'YOUR MONTH', title:'MONTH IN REVIEW', subtitle:monthLabel, entryCount:cur.length, bg:'linear-gradient(135deg,#fa9d93 0%,#ffd3ce 100%)' },
          { type:'monthly-habit-chart', label:hl.habit1, count:h1c, total:cur.length, arcColor:'#6d2d97', subtitle:pctLabel(pctChange(h1c,h1p)), bg:'linear-gradient(135deg,#f4eefe 0%,#e2d8f5 100%)' },
          { type:'monthly-habit-chart', label:hl.habit2, count:h2c, total:cur.length, arcColor:'#ff6b6b', subtitle:pctLabel(pctChange(h2c,h2p)), bg:'linear-gradient(135deg,#ffd3ce 0%,#ffe8e5 100%)' },
          { type:'monthly-habit-chart', label:hl.habit3, count:h3c, total:cur.length, arcColor:'#4f5bcf', subtitle:pctLabel(pctChange(h3c,h3p)), bg:'linear-gradient(135deg,#fff8e1 0%,#ffefc9 100%)' },
        ];
        if (topS.count > 0) slides.push({ type:'monthly-stat', label:'Longest Streak', stat:`${topS.count}`, unit:`day${topS.count!==1?'s':''}`, subtitle:`${topS.count} consecutive days of "${topS.label}"`, bg: '#ffd3ce' });
        if (bestDay >= 0) slides.push({ type:'monthly-stat', compact:true, label:'Mood Insight', stat:DAY_NAMES[bestDay], subtitle:`Your mood was brightest on ${DAY_NAMES[bestDay]}s this month. 😊`, bg:'linear-gradient(135deg,#e8dff8 0%,#d4c8e8 100%)' });
        slides.push({ type:'monthly-mood', stat:positivePct, subtitle:`Positive mood on ${positivePct}% of logged days`, bg:'#3d1b53', dark:true });
        return slides;
      }

      function buildAllTimeSlides(entries, hl) {
        const total = entries.length;
        const h1c=getHabitCount(entries,'habit1'), h2c=getHabitCount(entries,'habit2'), h3c=getHabitCount(entries,'habit3');
        const h1b=bestMonthForHabit(entries,'habit1'), h2b=bestMonthForHabit(entries,'habit2'), h3b=bestMonthForHabit(entries,'habit3');
        const h1s=longestStreakForHabit(entries,'habit1'), h2s=longestStreakForHabit(entries,'habit2'), h3s=longestStreakForHabit(entries,'habit3');
        const topS = [{...h1s,label:hl.habit1},{...h2s,label:hl.habit2},{...h3s,label:hl.habit3}].reduce((b,s)=>s.count>b.count?s:b,{count:0,label:''});
        const strMonth = topS.startDate ? new Date(topS.startDate).toLocaleDateString('en-US',{month:'long',year:'numeric'}) : '';
        const pct = n => total > 0 ? Math.round(n/total*100) : 0;
        return [
          { type:'intro', title:'JOURNAL\nWRAPPED', subtitle:getAllTimeRange(entries), entryCount:total,bg:'linear-gradient(135deg,#fa9d93 0%,#ffd3ce 100%)' },
          { type:'stat', emoji:'🏆', label:`Best Month — ${hl.habit1}`, stat:`${h1b.count} days`, subtitle:h1b.label, bg:'linear-gradient(135deg,#fff8e1 0%,#ffd3ce 100%)' },
          { type:'stat', emoji:'🏆', label:`Best Month — ${hl.habit2}`, stat:`${h2b.count} days`, subtitle:h2b.label, bg:'linear-gradient(135deg,#cbe5e4 0%,#a9d8e7 100%)' },
          { type:'stat', emoji:'🏆', label:`Best Month — ${hl.habit3}`, stat:`${h3b.count} days`, subtitle:h3b.label, bg:'linear-gradient(135deg,#f4eefe 0%,#cbc6db 100%)' },
          { type:'allstats', emoji:'📊', label:'All-Time Stats', habits:[
              {name:hl.habit1,count:h1c,total,pct:pct(h1c)},
              {name:hl.habit2,count:h2c,total,pct:pct(h2c)},

              habit1:{label:hl.habit1,count:h1c},

              habit3:{label:hl.habit3,count:h3c},
            }, bg:'linear-gradient(135deg,#fff8e1 0%,#ffd3ce 100%)' },
          { type:'stat', emoji:'🔥', label:'All-Time Longest Streak', stat:`${topS.count} day${topS.count!==1?'s':''}`,
            subtitle: topS.count > 0 ? `${topS.count} consecutive days of "${topS.label}"${strMonth?' starting '+strMonth:''}` : 'Start building your streak today!',
            bg:'linear-gradient(135deg,#3d1b53 0%,#6d2d97 100%)', dark:true },
        ];
      }

      function renderWrappedBarChart(data) {
        const container = document.getElementById('wrapped-chart');
        const keys = Object.keys(data);
        const margin = { top:20, right:16, bottom:70, left:20 };
        const totalW = Math.min(window.innerWidth - 60, 340);
        const width = totalW - margin.left - margin.right;
        const height = 180 - margin.top - margin.bottom;
        const barColors = ['#f56656','#6d2d97','#a9d8e7'];
        const svg = d3.select(container).append('svg')
          .attr('width', totalW).attr('height', height + margin.top + margin.bottom)
          .style('font-family', "'Poppins', sans-serif")
          .append('g').attr('transform', `translate(${margin.left},${margin.top})`);
        const x = d3.scaleBand().domain(keys).range([0, width]).padding(0.3);
        const maxVal = Math.max(...keys.map(k => data[k].count), 1);
        const y = d3.scaleLinear().domain([0, maxVal]).nice().range([height, 0]);
        svg.selectAll('rect').data(keys).enter().append('rect')
          .attr('x', d=>x(d)).attr('y', d=>y(data[d].count))
          .attr('width', x.bandwidth()).attr('height', d=>height-y(data[d].count))
          .attr('fill', (d,i)=>barColors[i]).attr('rx', 6);
        svg.selectAll('text.cnt').data(keys).enter().append('text').attr('class','cnt')
          .attr('x', d=>x(d)+x.bandwidth()/2).attr('y', d=>y(data[d].count)-5)
          .attr('text-anchor','middle').attr('fill','#3d1b53').attr('font-size','13px').attr('font-weight','600')
          .text(d=>data[d].count);
        keys.forEach((k,i) => {
          const label = data[k].label;
          const words = label.split(' ');
          const mid = Math.ceil(words.length / 2);
          const xc = x(k) + x.bandwidth()/2;
          const t = svg.append('text').attr('x',xc).attr('y',height+18).attr('text-anchor','middle').attr('fill','#3d1b53').attr('font-size','13px');
          t.append('tspan').attr('x',xc).attr('dy',0).text(words.slice(0,mid).join(' '));
          if (words.length > mid) t.append('tspan').attr('x',xc).attr('dy','1.2em').text(words.slice(mid).join(' '));
        });
      }

      function updateWrappedNav() {
        document.getElementById('wrapped-prev').style.visibility = wrappedIdx > 0 ? 'visible' : 'hidden';
        const isLast = wrappedIdx >= wrappedSlides.length - 1;
        document.getElementById('wrapped-next').innerHTML = isLast
          ? '<img src="icons/check2.svg" alt="Done" style="width:12px;">'
          : '<img src="icons/right-arrow.svg" alt="Next">';
        document.getElementById('wrapped-dots').innerHTML = wrappedSlides.map((_,i)=>`<span class="ws-dot${i===wrappedIdx?' active':''}"></span>`).join('');
      }

      function openWrappedModal(slides) {
        wrappedSlides = slides; wrappedIdx = 0;
        document.getElementById('wrapped-modal').style.display = 'flex';
        document.body.style.overflow = 'hidden';
        document.body.style.touchAction = 'none';
        renderWrappedSlide(wrappedSlides[0]);
        updateWrappedNav();
      }

      function closeWrappedModal() {
        document.getElementById('wrapped-modal').style.display = 'none';
        document.body.style.overflow = '';
        document.body.style.touchAction = '';
        const themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.setAttribute('content', '#ffd3ce');
      }

      function updateWrappedButton() {
        const btn = document.getElementById('wrapped-btn');
        if (!btn) return;
        if (currentView === 'weekly') btn.textContent = 'YOUR WEEK IN REVIEW';
        else if (currentView === 'monthly') btn.textContent = 'YOUR MONTH IN REVIEW';
        else btn.textContent = 'JOURNAL WRAPPED ✨';
      }

      document.getElementById('wrapped-btn').addEventListener('click', async () => {
        const user = auth.currentUser;
        if (!user) return;
        const snap = await getDoc(doc(db, 'habitLabels', user.uid));
        const hl = snap.exists() ? snap.data() : { habit1:'Habit 1', habit2:'Habit 2', habit3:'Habit 3' };
        const slides = currentView === 'weekly'
          ? buildWeeklySlides(new Date(currentStartDate), allEntries, hl)
          : currentView === 'monthly'
          ? buildMonthlySlides(new Date(currentStartDate), allEntries, hl)
          : buildAllTimeSlides(allEntries, hl);
        openWrappedModal(slides);
      });

      document.getElementById('wrapped-close').addEventListener('click', closeWrappedModal);

      document.getElementById('wrapped-prev').addEventListener('click', () => {
        if (wrappedIdx > 0) { wrappedIdx--; renderWrappedSlide(wrappedSlides[wrappedIdx]); updateWrappedNav(); }
      });

      document.getElementById('wrapped-next').addEventListener('click', () => {
        if (wrappedIdx < wrappedSlides.length-1) { wrappedIdx++; renderWrappedSlide(wrappedSlides[wrappedIdx]); updateWrappedNav(); }
        else closeWrappedModal();
      });

      document.getElementById('wrapped-modal').addEventListener('click', e => {
        if (e.target.id === 'wrapped-modal') closeWrappedModal();
      });

      document.getElementById('wrapped-modal').addEventListener('touchmove', e => {
        e.stopPropagation();
      }, {passive: false});

      document.getElementById('wrapped-slide-body').addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
      }, {passive:true});

      document.getElementById('wrapped-slide-body').addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) < 50) return;
        if (dx < 0 && wrappedIdx < wrappedSlides.length-1) { wrappedIdx++; renderWrappedSlide(wrappedSlides[wrappedIdx]); updateWrappedNav(); }
        else if (dx > 0 && wrappedIdx > 0) { wrappedIdx--; renderWrappedSlide(wrappedSlides[wrappedIdx]); updateWrappedNav(); }
      }, {passive:true});

      document.addEventListener('keydown', e => {
        if (document.getElementById('wrapped-modal').style.display !== 'flex') return;
        if (e.key === 'ArrowRight' && wrappedIdx < wrappedSlides.length-1) { wrappedIdx++; renderWrappedSlide(wrappedSlides[wrappedIdx]); updateWrappedNav(); }
        else if (e.key === 'ArrowLeft' && wrappedIdx > 0) { wrappedIdx--; renderWrappedSlide(wrappedSlides[wrappedIdx]); updateWrappedNav(); }
        else if (e.key === 'Escape') closeWrappedModal();
      });

    </script>
</head>

<body>
    <div class="header-container">
        <div class="menu-wrapper">
            <button id="menu-toggle" class="menu-button" aria-label="Toggle menu">
            <span class="menu-line line1"></span>
            <span class="menu-line line2"></span>
            </button>
            <nav class="menu-items">
            <a href="index.html">HOME</a>
            <a href="about.html">ABOUT</a>
            <a href="customize.html">CUSTOMIZE</a>
            <a href="#" id="logout">LOGOUT</a>
            </nav>
        </div>
    </div>
    <div class="controls-container">
        <div class="toggle-buttons">
          <button id="weekly" class="active">WEEKLY</button>
          <button id="monthly">MONTHLY</button>
          <button id="all">ALL</button>
        </div>
      
        <div class="nav-arrow">
          <button id="prev-date">
            <img src="icons/left-arrow.svg" alt="Previous Day" />
          </button>
          <span id="current-range">THIS WEEK</span>
          <button id="next-date">
            <img src="icons/right-arrow.svg" alt="Next Day" />
          </button>
        </div>
    </div>
      
    <!-- Plots -->
    <div id="chart-wrapper" style="display: none;">
        <div id="mood-bar-chart"></div>
    </div>

    <div id="streak-count"></div>

    <!--Search -->
    <div class="search-section">
      <div class="search-container">
        <div class="search-bar">
          <input type="text" id="search-input" placeholder="Search your journal...">
          <button id="clear-search" class="clear-button">
            <img src="icons/close4.svg" alt="Clear search">
          </button>
        </div>
        <button id="search-btn">
          <img src="icons/search.svg" alt="Search" />
        </button>
      </div>

      <div id="search-loader" class="loader" style="display: none;">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div id="search-results" class="search-results-container">
      </div>

    </div>

    <button class="toggle-buttons" id="wrapped-btn">YOUR WEEK IN REVIEW</button>

    <div class="space"></div>
    
    <!-- JOURNAL WRAPPED MODAL -->
    <div id="wrapped-modal">
      <div id="wrapped-modal-inner">
        <button id="wrapped-close"><img src="icons/close2.svg" alt="Close"></button>
        <div id="wrapped-slide-body"></div>
        <div id="wrapped-nav">
          <button id="wrapped-prev" class="ws-nav-btn"><img src="icons/left-arrow.svg" alt="Previous"></button>
          <div id="wrapped-dots"></div>
          <button id="wrapped-next" class="ws-nav-btn"><img src="icons/right-arrow.svg" alt="Next"></button>
        </div>
      </div>
    </div>

</body>
</html>
