<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffd3ce" id="theme-color-meta">
    <title>Trends</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/svg" href="icon.svg">

    <meta name="theme-color" content="#f4eefe" id="theme-color-meta">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script type="module">
        let selectedHabitId = "habit1"; 

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
          getAuth,
          onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import {
          getFirestore,
          collection,
          getDocs,
          doc,
          getDoc,
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
      
        const firebaseConfig = {
          apiKey: "AIzaSyBMOeKuVRPshQvryw8wux5Q9xDuUZ9Nlms",
          authDomain: "journal-danielaggwm.firebaseapp.com",
          projectId: "journal-danielaggwm",
          storageBucket: "journal-danielaggwm",
          messagingSenderId: "711305745141",
          appId: "1:711305745141:web:cfd67957ec5c920035ebbc",
          measurementId: "G-Q5SQGEPBF2"
        };
      
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
      
        const moodColors = {
          good: "#4caf50",
          sad: "#2196f3",
          angry: "#f44336",
          excited: "#ff9800"
        };
      
        let currentView = "weekly";
        let currentStartDate = getStartOfWeek(new Date());
        let allEntries = [];
      
        onAuthStateChanged(auth, async user => {
          if (!user) return;
      
          const entriesRef = collection(db, "journalEntries");
          const snap = await getDocs(entriesRef);
      
          allEntries = [];
      
          snap.forEach(doc => {
            const [entryUid] = doc.id.split("_");
            if (entryUid !== user.uid) return;
      
            const data = doc.data();
            const dateStr = doc.id.split("_")[1];
            const [year, month, day] = dateStr.split("-").map(Number);
            const date = new Date(year, month - 1, day);
            date.setHours(0, 0, 0, 0);

      
            allEntries.push({ date, mood: data.mood, habits: data.habits });
          });
      
          await drawStreakCounter(); // ✅ draw UI before trying to update values
          await renderForCurrentView();
        });
      
        // ✅ Updated to make weeks start on Monday
        function getStartOfWeek(date) {
          const d = new Date(date);
          const day = d.getDay(); // 0 (Sun) to 6 (Sat)
          const diff = (day + 6) % 7; // Shift so Monday is 0
          d.setDate(d.getDate() - diff);
          d.setHours(0, 0, 0, 0);
          return d;
        }
      
        function getStartOfMonth(date) {
          const d = new Date(date);
          d.setDate(1);
          d.setHours(0, 0, 0, 0);
          return d;
        }
      
        function updateRangeLabel(start, end) {
          const format = d => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
          document.getElementById('current-range').textContent = `${format(start)} – ${format(end)}`;
        }
      
        function filterEntriesByView(entries, view, refDate) {
          let start = new Date(refDate);
          let end = new Date(refDate);
      
          if (view === 'weekly') {
            start = getStartOfWeek(refDate);
            end = new Date(start);
            end.setDate(start.getDate() + 6);
          } else if (view === 'monthly') {
            start = getStartOfMonth(refDate);
            end = new Date(start);
            end.setMonth(start.getMonth() + 1);
            end.setDate(0);
          } else {
            document.getElementById('current-range').textContent = "All Time";
            return entries;
          }
      
          updateRangeLabel(start, end);
      
          return entries.filter(e => {
            const day = new Date(e.date);
            day.setHours(0, 0, 0, 0);
            return day >= start && day <= end;
          });
        }
      
        function drawMoodBarChart(data) {
            const container = document.getElementById('mood-bar-chart');
            const wrapper = document.getElementById('chart-wrapper');
            container.innerHTML = "";

            const margin = { top: 40, right: 25, bottom: 60, left: 25 };
            const baseWidth = window.innerWidth < 400 ? 350 : 400;
            const width = baseWidth - margin.left - margin.right;
            const height = 300 - margin.top - margin.bottom;

            const svg = d3.select(container)
                .append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .style("font-family", "'Poppins', sans-serif")
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            const moods = Object.keys(data);
            const counts = Object.values(data);

            const x = d3.scaleBand()
                .domain(moods)
                .range([0, width])
                .padding(0.4);

            const y = d3.scaleLinear()
                .domain([0, d3.max(counts) || 1]) 
                .nice()
                .range([height, 0]);

            svg.selectAll("rect")
                .data(moods)
                .enter()
                .append("rect")
                .attr("x", d => x(d))
                .attr("y", d => y(data[d]))
                .attr("width", x.bandwidth())
                .attr("height", d => height - y(data[d]))
                .attr("fill", d => moodColors[d])
                .attr("rx", 6)
                .attr("ry", 6);

            svg.selectAll("text.label")
                .data(moods)
                .enter()
                .append("text")
                .filter(d => data[d] > 0)
                .attr("class", "label")
                .attr("x", d => x(d) + x.bandwidth() / 2)
                .attr("y", d => y(data[d]) - 6)
                .attr("text-anchor", "middle")
                .attr("fill", "#3d1b53")
                .attr("font-size", "14px")
                .text(d => data[d]);

            const iconPaths = {
                good: "/journal/icons/good.svg",
                sad: "/journal/icons/sad.svg",
                angry: "/journal/icons/angry.svg",
                excited: "/journal/icons/excited.svg"
            };

            moods.forEach(mood => {
                const xCenter = x(mood) + x.bandwidth() / 2;

                svg.append("image")
                    .attr("href", iconPaths[mood])
                    .attr("x", xCenter - 12)
                    .attr("y", height + 4)
                    .attr("width", 24)
                    .attr("height", 24);

                svg.append("text")
                    .attr("x", xCenter)
                    .attr("y", height + 40)
                    .attr("text-anchor", "middle")
                    .attr("font-size", "12px")
                    .attr("fill", "#3d1b53")
                    .text(mood.toUpperCase());
            });

            //  Now that everything is ready, reveal the container + add the class that adds styles
            wrapper.classList.add("chart-visible");
            wrapper.style.display = "block";
            container.style.display = "block";
        }

      
        function renderForCurrentView() {
            const filtered = filterEntriesByView(allEntries, currentView, currentStartDate);

            const moodCounts = {
                good: 0,
                sad: 0,
                angry: 0,
                excited: 0
            };

            filtered.forEach(entry => {
                if (entry.mood && moodCounts.hasOwnProperty(entry.mood)) {
                moodCounts[entry.mood]++;
                }
            });

            drawMoodBarChart(moodCounts);

            // ✅ Add this line to refresh the streak section
            const user = auth.currentUser;
            if (!user) return;

            getDoc(doc(db, "habitLabels", user.uid)).then(docSnap => {
                const habitLabels = docSnap.exists()
                ? docSnap.data()
                : {
                    habit1: "Worked out?",
                    habit2: "Read a book?",
                    habit3: "Called your parents?"
                    };

                updateStreakData(habitLabels);
            });
        }

      
        document.getElementById('weekly').addEventListener('click', () => {
          currentView = 'weekly';
          currentStartDate = getStartOfWeek(new Date());
          renderForCurrentView();
        });
      
        document.getElementById('monthly').addEventListener('click', () => {
          currentView = 'monthly';
          currentStartDate = getStartOfMonth(new Date());
          renderForCurrentView();
        });
      
        document.getElementById('all').addEventListener('click', () => {
          currentView = 'all';
          document.getElementById('current-range').textContent = "All Time";
          renderForCurrentView();
        });
      
        document.getElementById('prev-date').addEventListener('click', () => {
          if (currentView === 'weekly') {
            currentStartDate.setDate(currentStartDate.getDate() - 7);
          } else if (currentView === 'monthly') {
            currentStartDate.setMonth(currentStartDate.getMonth() - 1);
          }
          renderForCurrentView();
        });
      
        document.getElementById('next-date').addEventListener('click', () => {
          if (currentView === 'weekly') {
            currentStartDate.setDate(currentStartDate.getDate() + 7);
          } else if (currentView === 'monthly') {
            currentStartDate.setMonth(currentStartDate.getMonth() + 1);
          }
          renderForCurrentView();
        });

        const toggleButtons = document.querySelectorAll('.toggle-buttons button');

        toggleButtons.forEach(button => {
        button.addEventListener('click', () => {
            toggleButtons.forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
        });
        });

        // —————— Elements ——————
        const menuButton = document.getElementById('menu-toggle');
        const menuWrapper = document.querySelector('.menu-wrapper');
        const menuLinks = document.querySelectorAll('.menu-items a');
    
        // —————— MENU: open/close toggle ——————
        menuButton.addEventListener('click', () => {
        menuButton.classList.toggle('open');
        menuWrapper.classList.toggle('open');
        });
    
        // —————— MENU: collapse on any link click ——————
        menuLinks.forEach(link => {
        link.addEventListener('click', () => {
            menuButton.classList.remove('open');
            menuWrapper.classList.remove('open');
        });
        });
    
        // —————— LOGOUT: Handle logout ——————
        document.getElementById('logout').addEventListener('click', async (e) => {
        e.preventDefault();
        await auth.signOut();
        window.location.href = 'index.html';
        });

        async function drawStreakCounter() {
            const container = document.getElementById("streak-count");

            const wrapper = document.createElement("div");
            wrapper.style.display = "flex";
            wrapper.style.flexDirection = "column";
            wrapper.style.alignItems = "center";
            wrapper.style.marginTop = "2rem";
            wrapper.style.fontFamily = "'Poppins', sans-serif";
            wrapper.style.color =  "#3d1b53";

            const selector = document.createElement("select");
            selector.style.padding = "8px";
            selector.style.marginBottom = "1rem";

            const user = auth.currentUser;
            if (!user) return;

            const habitDocRef = doc(db, "habitLabels", user.uid);
            const docSnap = await getDoc(habitDocRef);
            const habitLabels = docSnap.exists()
                ? docSnap.data()
                : {
                    habit1: "Worked out?",
                    habit2: "Read a book?",
                    habit3: "Called your parents?"
                };

            const habitList = [
                { id: "habit1", label: habitLabels.habit1 },
                { id: "habit2", label: habitLabels.habit2 },
                { id: "habit3", label: habitLabels.habit3 },
                { id: "ALL", label: "All Habits" }
            ];

            habitList.forEach(opt => {
                const option = document.createElement("option");
                option.value = opt.id;
                option.textContent = opt.label;
                selector.appendChild(option);
            });

            selector.value = selectedHabitId;

            selector.addEventListener("change", () => {
                selectedHabitId = selector.value;
                updateStreakData(habitLabels);
            });

            wrapper.appendChild(selector);

            const grid = document.createElement("div");
            grid.id = "streak-grid"; 
            grid.style.display = "grid";
            grid.style.gridTemplateColumns = "repeat(3, 1fr)";
            grid.style.gap = "2rem";
            wrapper.appendChild(grid);

            container.innerHTML = "";
            container.appendChild(wrapper);

            updateStreakData(habitLabels);
        }

        function updateStreakData(habitLabels) {
            const selectedHabits =
                selectedHabitId === "ALL"
                ? ["habit1", "habit2", "habit3"]
                : [selectedHabitId];

            const streakData = computeHabitStreaks(allEntries, selectedHabits, habitLabels);
            const totalEntries = filterEntriesByView(allEntries, currentView, currentStartDate).length;

            const grid = document.getElementById("streak-grid");
            grid.innerHTML = "";

            const createMetric = (label, value) => {
                const box = document.createElement("div");
                box.style.textAlign = "center";
                const val = document.createElement("div");
                val.textContent = value;
                val.style.fontSize = "2rem";
                val.style.fontWeight = "600";
                const lbl = document.createElement("div");
                lbl.innerHTML = label.replace(" ", "<br>");
                lbl.style.fontSize = "0.9rem";
                lbl.style.color = "#3d1b53";
                box.appendChild(val);
                box.appendChild(lbl);
                return box;
            };

            grid.appendChild(createMetric("CURRENT STREAK", streakData.current));
            grid.appendChild(createMetric("LONGEST STREAK", streakData.longest));
            grid.appendChild(createMetric("TOTAL ENTRIES", totalEntries));
        }


        function computeHabitStreaks(entries, selectedHabits, currentLabels = {}) {
            const entriesByDate = new Map();
            entries.forEach(e => {
                const d = new Date(e.date);
                d.setHours(0, 0, 0, 0);
                entriesByDate.set(d.getTime(), e);
            });

            const formatDate = d => d.toISOString().split("T")[0];

            const validDateSet = new Set();

            for (const [ts, entry] of entriesByDate.entries()) {
                const hasAllHabits = selectedHabits.every(habitId => {
                const habitEntry = entry.habits?.[habitId];
                if (!habitEntry) return false;

                const currentLabel = currentLabels[habitId];
                const entryLabel = habitEntry.label || habitId;

                if (currentLabel && entryLabel !== currentLabel) return false;

                return habitEntry.value === "yes";
                });

                if (hasAllHabits) {
                validDateSet.add(formatDate(new Date(ts)));
                }
            }

            // ——— CURRENT STREAK ———
            let current = 0;
            let cursor = new Date();
            cursor.setHours(0, 0, 0, 0);

            const todayTs = cursor.getTime();
            const entryToday = entriesByDate.get(todayTs);

            // If there's no valid entry today, move the cursor to yesterday
            const isValidToday = (() => {
            if (!entryToday) return false;
            return selectedHabits.every(habitId => {
                const habitEntry = entryToday.habits?.[habitId];
                if (!habitEntry) return false;

                const currentLabel = currentLabels[habitId];
                const entryLabel = habitEntry.label || habitId;
                if (currentLabel && entryLabel !== currentLabel) return false;

                return habitEntry.value === "yes";
            });
            })();

            if (!isValidToday) {
            cursor.setDate(cursor.getDate() - 1);
            }

            while (true) {
                const ts = cursor.getTime();
                const entry = entriesByDate.get(ts);

                if (!entry) break;

                const isValid = selectedHabits.every(habitId => {
                const habitEntry = entry.habits?.[habitId];
                if (!habitEntry) return false;

                const currentLabel = currentLabels[habitId];
                const entryLabel = habitEntry.label || habitId;

                if (currentLabel && entryLabel !== currentLabel) return false;

                return habitEntry.value === "yes";
                });

                if (!isValid) break;

                current++;
                cursor.setDate(cursor.getDate() - 1);
            }

            // ——— LONGEST STREAK ———
            const validDates = [...validDateSet].map(d => new Date(d)).sort((a, b) => a - b);
            let longest = 0;
            let streak = 0;
            let prev = null;

            for (const date of validDates) {
                if (!prev) {
                streak = 1;
                } else {
                const diff = (date - prev) / (1000 * 60 * 60 * 24);
                streak = diff === 1 ? streak + 1 : 1;
                }
                longest = Math.max(longest, streak);
                prev = date;
            }

            return {
                current,
                longest,
                total: validDateSet.size
            };
        }

    </script>
</head>

<body>
    <div class="header-container">
        <div class="menu-wrapper">
            <button id="menu-toggle" class="menu-button" aria-label="Toggle menu">
            <span class="menu-line line1"></span>
            <span class="menu-line line2"></span>
            </button>
            <nav class="menu-items">
            <a href="index.html">HOME</a>
            <a href="about.html">ABOUT</a>
            <a href="customize.html">CUSTOMIZE</a>
            <a href="#" id="logout">LOGOUT</a>
            </nav>
        </div>
    </div>

        <div class="toggle-buttons">
          <button id="weekly" class="active">WEEKLY</button>
          <button id="monthly">MONTHLY</button>
          <button id="all">ALL</button>

        <div class="nav-arrow">
          <button id="prev-date">
            <img src="icons/left-arrow.svg" alt="Previous Day" />
          </button>

            <img src="icons/right-arrow.svg" alt="Next Day" />
          </button>
        </div>
    </div>
      
    <!-- Plots -->
    <div id="chart-wrapper" style="display: none;">
        <div id="mood-bar-chart"></div>
    </div>

    <div id="streak-count"></div>
</body>
