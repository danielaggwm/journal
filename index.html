<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f0fb" id="theme-color-meta">
    <title>My Journal</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Warm up connections to the library CDNs so first load is quicker -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <link rel="icon" type="image/svg" href="icon.svg">

    <!-- Loading screen shown until Firebase auth resolves, so a slow mobile
         connection sees a spinner instead of a blank page. -->
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        /* Matches the calendar background: coral fading to light lilac. */
        background: linear-gradient(to bottom, #ffd3ce, #fbf9fe);
        font-family: 'Poppins', system-ui, sans-serif;
        color: #b0483c;
        text-align: center;
        padding: 1.5rem;
      }
      #app-loader .spinner {
        width: 42px;
        height: 42px;
        border: 4px solid #ffd3ce;
        border-top-color: #f56656;
        border-radius: 50%;
        animation: app-loader-spin 0.9s linear infinite;
      }
      #app-loader-text { margin: 0; font-size: 0.95rem; }
      @keyframes app-loader-spin { to { transform: rotate(360deg); } }

      /* Spinner overlay inside the entry modal (first, uncached open only). */
      #journal-form { position: relative; }
      #entry-loading {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 253, 252, 0.8);
        border-radius: inherit;
      }
      #entry-loading .spinner {
        width: 34px;
        height: 34px;
        border: 4px solid #ffd3ce;
        border-top-color: #f56656;
        border-radius: 50%;
        animation: app-loader-spin 0.9s linear infinite;
      }
    </style>

    <!-- Watchdog: if the app hasn't come up in 10s (failed CDN, offline, etc.),
         turn the loading screen into a tap-to-retry message instead of a
         permanent blank/spinner. Plain script so it runs even if modules fail. -->
    <script>
      window.__appReady = false;
      setTimeout(function () {
        if (window.__appReady) return;
        var loader = document.getElementById('app-loader');
        var text = document.getElementById('app-loader-text');
        if (text) text.textContent = 'Having trouble loading. Check your connection, then tap to retry.';
        if (loader) {
          loader.style.cursor = 'pointer';
          loader.addEventListener('click', function () { location.reload(); });
        }
      }, 10000);
    </script>

    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/main.min.css" rel="stylesheet"/>

    <!-- Firebase JS-->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-analytics.js";

        import {
          getFirestore, doc, setDoc, getDoc, deleteDoc
        } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

        import {
          getStorage, ref, uploadBytes, getDownloadURL, deleteObject
        } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-storage.js";

        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut
            } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
                
        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
          apiKey: "AIzaSyBMOeKuVRPshQvryw8wux5Q9xDuUZ9Nlms",
          authDomain: "journal-danielaggwm.firebaseapp.com",
          projectId: "journal-danielaggwm",
          storageBucket: "journal-danielaggwm.firebasestorage.app",
          messagingSenderId: "711305745141",
          appId: "1:711305745141:web:cfd67957ec5c920035ebbc",
          measurementId: "G-Q5SQGEPBF2"
        };
      
        // Initialize Firebase. Set the essentials first so the app can run,
        // then attempt analytics separately — analytics is frequently blocked
        // on mobile (privacy settings / ad blockers) and, if it throws here,
        // it would prevent window.firebaseApp from being set and leave the
        // page blank until a lucky reload.
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        window.firebaseApp = { auth, db, storage };

        try {
          getAnalytics(app);
        } catch (e) {
          console.warn("Analytics unavailable (non-fatal):", e);
        }

    </script>

    <!-- FullCalendar JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    
    <!-- image resizer -->
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>

    <script type="module" src="script.js"></script>


</head>

<body>
    <!-- Loading screen (removed by script.js once Firebase auth resolves) -->
    <div id="app-loader">
      <div class="spinner"></div>
      <p id="app-loader-text">Loading your journal…</p>
    </div>

    <!-- LOGIN MODAL -->
    <div id="auth-modal" class="modal">
        <div class="login-wrapper">
          <div class="login-title">
            <h2>LOGIN</h2>
          </div>

          <input type="email" id="email" placeholder="Email" />
          <input type="password" id="password" placeholder="Password" />

          <!-- Forgot password -->
          <div class="forgot-password">
            <a href="#" id="forgot-password">Forgot password?</a>
          </div>

          <div class="auth-buttons">
            <button id="login">Login</button>
            <button id="signup">Sign Up</button>
          </div>

          
        </div>
    </div>    

    <div class="header-container">
      <div class="menu-wrapper">
        <button id="menu-toggle" class="menu-button" aria-label="Toggle menu">
          <span class="menu-line line1"></span>
          <span class="menu-line line2"></span>
        </button>
        <nav class="menu-items">
          <a href="about.html">ABOUT</a>
          <a href="trends.html">TRENDS</a>
          <a href="customize.html">CUSTOMIZE</a>
          <a href="#" id="logout">LOGOUT</a>
        </nav>
      </div>
    
    </div>
  
    <!-- CALENDAR -->
    <div id="calendar" style="display: none;"></div>

    <div class="space"></div>

    <div id="journal-modal" class="modal" style="display: none;">
      <div class="modal-content" id="journal-form">

        <!-- Shown only on the first, uncached open of a day while its entry
             loads, so the modal shows a spinner instead of looking blank. -->
        <div id="entry-loading" style="display:none;">
          <div class="spinner"></div>
        </div>

        <button id="close-modal" class="close-button">
          <img src="/journal/icons/close2.svg" alt="Close" />
        </button>

        <div class="journal-date-nav">
          <button id="prev-date" aria-label="Previous Day">
            <img src="/journal/icons/left-arrow.svg" alt="Previous Day" />
          </button>
          <h2 id="journal-date-label">Journal Entry</h2>
          <button id="next-date" aria-label="Next Day">
            <img src="/journal/icons/right-arrow.svg" alt="Next Day" />
          </button>
        </div>
        
        <div class="mood">
          <label>How do you feel?</label>
          <div id="mood-select" class="mood-row">
            <button class="mood-button" data-mood="excited" aria-label="Excited">
              <img src="/journal/icons/excited.svg" alt="Excited mood" />
            </button>
            <button class="mood-button" data-mood="good" aria-label="Good">
              <img src="/journal/icons/good.svg" alt="Good mood" />
            </button>
            <button class="mood-button" data-mood="sad" aria-label="Sad">
              <img src="/journal/icons/sad.svg" alt="Sad mood" />
            </button>
            <button class="mood-button" data-mood="angry" aria-label="Angry">
              <img src="/journal/icons/angry.svg" alt="Angry mood" />
            </button>
          </div>
        </div>

        <input type="hidden" id="selected-mood" name="mood" />

        <!-- HABIT 1 -->
        <div class="habit-container" id="habit1-container">
          <label class="habit-label" data-habit="habit1">Worked out?</label>
          <div class="habit-row" id="habit1-select">
            <button class="habit-button" data-value="no">
              <img src="/journal/icons/close.svg" alt="No" />
            </button>
            <button class="habit-button" data-value="yes">
              <img src="/journal/icons/check.svg" alt="Yes" />
            </button>
          </div>
          <input type="hidden" id="selected-habit1" />
        </div>

        <!-- HABIT 2 -->
        <div class="habit-container" id="habit2-container">
          <label class="habit-label" data-habit="habit2">Read a book?</label>
          <div class="habit-row" id="habit2-select">
            <button class="habit-button" data-value="no">
              <img src="/journal/icons/close.svg" alt="No" />
            </button>
            <button class="habit-button" data-value="yes">
              <img src="/journal/icons/check.svg" alt="Yes" />
            </button>
          </div>
          <input type="hidden" id="selected-habit2" />
        </div>

        <!-- HABIT 3 -->
        <div class="habit-container" id="habit3-container">
          <label class="habit-label" data-habit="habit3">Called your parents?</label>
          <div class="habit-row" id="habit3-select">
            <button class="habit-button" data-value="no">
              <img src="/journal/icons/close.svg" alt="No" />
            </button>
            <button class="habit-button" data-value="yes">
              <img src="/journal/icons/check.svg" alt="Yes" />
            </button>
          </div>
          <input type="hidden" id="selected-habit3" />
        </div>





        
        <input type="hidden" id="selected-called" />

      
        <!-- <label>describe your day</label> -->
        <textarea id="description" placeholder="Describe your day..."></textarea>

        <div class="upload-wrapper">
          <label for="image-upload" id="upload-label" class="custom-file-upload">Upload image</label>
        </div>
              
        <input type="file" id="image-upload" accept="image/*" style="display:none;" />

        <div id="image-preview-wrapper" style="display: none; position: relative;">
          <img id="image-preview" src="" alt="Image preview" />
          <button id="remove-image" class="remove-image-button">
            <img src="/journal/icons/close3.svg" alt="Close" />
          </button>
        </div>

    
        <div class="auth-buttons">
          <button id="save-entry">Save Journal</button>
          <button id="clear-entry" style="display: none;">Clear</button>
        </div>
      </div>
    </div>

    <div id="image-overlay" class="image-overlay" style="display: none;">
        <img id="full-image" src="" alt="Full image preview" />
        <div class="nav-controls">
          <button id="prev-image" class="nav-button">
            <img src="/journal/icons/left-arrow.svg" alt="Previous Day" class="nav-icon" />
          </button>
          <button id="next-image" class="nav-button">
            <img src="/journal/icons/right-arrow.svg" alt="Next Day" class="nav-icon" />
          </button>
        </div>
    </div>

    <!-- Register the service worker: caches the app shell so repeat visits
         load fast and work on flaky connections. Registered after load so it
         never competes with the initial render. -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function (err) {
            console.warn('Service worker registration failed:', err);
          });
        });
      }
    </script>

</body>
</html>
