<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4eefe" id="theme-color-meta">
  <title>Customize Habits</title>
  <link rel="stylesheet" href="base.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  
  
  <script type="module">
    const themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) {
            themeMeta.setAttribute("content", "#ffd3ce");
        }

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  
    const firebaseConfig = {
      apiKey: "AIzaSyBMOeKuVRPshQvryw8wux5Q9xDuUZ9Nlms",
      authDomain: "journal-danielaggwm.firebaseapp.com",
      projectId: "journal-danielaggwm",
      storageBucket: "journal-danielaggwm.firebasestorage.app",
      messagingSenderId: "711305745141",
      appId: "1:711305745141:web:cfd67957ec5c920035ebbc",
      measurementId: "G-Q5SQGEPBF2"
    };
  
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
  
    const defaultHabits = {
      habit1: 'Worked out?',
      habit2: 'Read a book?',
      habit3: 'Called your parents?'
    };
    
    let habitHistory = {}; // habit1 -> [label1, label2...]
  
    onAuthStateChanged(auth, async user => {
      if (!user) return;
  
      const habitDocRef = doc(db, "habitLabels", user.uid);
      const docSnap = await getDoc(habitDocRef);
      const data = docSnap.exists() ? docSnap.data() : defaultHabits;
  
      // Populate input fields
      for (let i = 1; i <= 3; i++) {
        const input = document.getElementById(`habit${i}-input`);
        input.value = data[`habit${i}`] || defaultHabits[`habit${i}`];
      }
  
      document.getElementById('save-button').addEventListener('click', async () => {
        const updatedHabits = {
          habit1: document.getElementById('habit1-input').value.trim(),
          habit2: document.getElementById('habit2-input').value.trim(),
          habit3: document.getElementById('habit3-input').value.trim()
        };
  
        await setDoc(habitDocRef, updatedHabits);
        alert("Your habits have been updated!");
      });
  
      // ——— Fetch history by scanning journalEntries ———
      const journalRef = collection(db, "journalEntries");
      const snap = await getDocs(journalRef); // no `where` to respect security rules
  
      const seen = {
        habit1: new Set(),
        habit2: new Set(),
        habit3: new Set()
      };
  
      snap.forEach(doc => {
        const entryId = doc.id; // e.g. "uid_2024-07-09"
        const [entryUid] = entryId.split("_");
        if (entryUid !== user.uid) return;
  
        const entry = doc.data();
        if (!entry.habits) return;
  
        for (let i = 1; i <= 3; i++) {
          const hKey = `habit${i}`;
          const label = entry.habits?.[hKey]?.label;
          if (label) seen[hKey].add(label);
        }
      });
  
      for (let i = 1; i <= 3; i++) {
        const hKey = `habit${i}`;
        habitHistory[hKey] = Array.from(seen[hKey]);
      }
  
      // Hook up history buttons
      document.querySelectorAll('.history-button').forEach(button => {
        button.addEventListener('click', e => {
          const habitKey = e.currentTarget.dataset.habit;
          const history = habitHistory[habitKey];
  
          if (history && history.length > 0) {
            alert(`Previous labels for ${habitKey}:\n\n${history.join('\n')}`);
          } else {
            alert(`No history found for ${habitKey}.`);
          }
        });
      });
    });
  
    // —————— Elements ——————
    const menuButton = document.getElementById('menu-toggle');
    const menuWrapper = document.querySelector('.menu-wrapper');
    const menuLinks = document.querySelectorAll('.menu-items a');
  
    // —————— MENU: open/close toggle ——————
    menuButton.addEventListener('click', () => {
      menuButton.classList.toggle('open');
      menuWrapper.classList.toggle('open');
    });
  
    // —————— MENU: collapse on any link click ——————
    menuLinks.forEach(link => {
      link.addEventListener('click', () => {
        menuButton.classList.remove('open');
        menuWrapper.classList.remove('open');
      });
    });
  
    // —————— LOGOUT: Handle logout ——————
    document.getElementById('logout').addEventListener('click', async (e) => {
      e.preventDefault();
      await auth.signOut();
      window.location.href = 'index.html';
    });
  </script>
  
</head>
<body>
    <div class="header-container">
        <div class="menu-wrapper">
            <button id="menu-toggle" class="menu-button" aria-label="Toggle menu">
            <span class="menu-line line1"></span>
            <span class="menu-line line2"></span>
            </button>
            <nav class="menu-items">
            <a href="index.html">HOME</a>
            <a href="#">ABOUT</a>
            <a href="trends.html">TRENDS</a>
            <a href="#" id="logout">LOGOUT</a>
            </nav>
        </div>
    </div>

  <div class="habit-customization">
    <h1>Customize your habits</h1>
    <p>Feel free to update the habits you want to track—your past data 
        will still be connected to the original habit names.
    </p>

    <label for="habit1-input">Habit 1:</label>
    <div class="habit-input-wrapper">
      <input type="text" id="habit1-input" />
      <button class="history-button" data-habit="habit1" title="View history">
        <img src="/journal/icons/history.svg" alt="History" />
      </button>
    </div>
    
    <label for="habit2-input">Habit 2:</label>
    <div class="habit-input-wrapper">
      <input type="text" id="habit2-input" />
      <button class="history-button" data-habit="habit2" title="View history">
        <img src="/journal/icons/history.svg" alt="History" />
      </button>
    </div>
    
    <label for="habit3-input">Habit 3:</label>
    <div class="habit-input-wrapper">
      <input type="text" id="habit3-input" />
      <button class="history-button" data-habit="habit3" title="View history">
        <img src="/journal/icons/history.svg" alt="History" />
      </button>
    </div>
    
    <br><br>
    <button id="save-button">Save</button>
  </div>
</body>
</html>
